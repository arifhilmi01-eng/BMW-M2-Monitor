name: Car Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find script and install deps
        run: |
          SCRIPT=$(find . -name "car_monitor.py" | head -1)
          echo "Found script at: $SCRIPT"
          DIR=$(dirname "$SCRIPT")
          echo "SCRIPT_DIR=$DIR" >> $GITHUB_ENV
          pip install -r "$DIR/requirements.txt"

      - name: Run scraper
        run: python "$SCRIPT_DIR/car_monitor.py"

      - name: Commit updated dashboard
        run: |
          git config user.name "Car Monitor Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
